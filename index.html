
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Korfbal Schotklok</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
body{display:flex;justify-content:center;align-items:center}
.app{width:100%;height:100%;height:100dvh;max-width:1000px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
header{text-align:center;padding:12px 0;font-size:clamp(16px,3vw,24px);font-weight:800;letter-spacing:4px;color:#aaa}
.display{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px}
.time{font-size:clamp(180px,52vw,420px);font-weight:900;line-height:.85;letter-spacing:-.07em;font-variant-numeric:tabular-nums}
.label{margin-top:24px;font-size:clamp(14px,3vw,20px);font-weight:700;letter-spacing:7px;color:#888}
.status{margin-top:18px;font-size:clamp(13px,3vw,18px);font-weight:800;letter-spacing:2px;color:#777}
.running .time{color:#fff}
.stopped .time{color:#aaa}
.zero .time{color:#ff3434}
.zero .status{color:#ff3434}
.controls{padding:14px 0 18px}
.row{display:flex;gap:12px;margin-top:12px}
button{border:0;border-radius:16px;min-width:0;flex:1;height:clamp(58px,10vh,82px);font-size:clamp(20px,5vw,30px);font-weight:900;color:#fff;background:#292929;touch-action:manipulation;user-select:none}
button:active{filter:brightness(1.35);transform:scale(.98)}
.adjust{background:#222}
.start{background:#087c3b}
.stop{background:#a52222}
.reset{background:#333}

.counter{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.adjust-buttons{display:flex;flex-direction:column;gap:8px;flex:none;width:clamp(48px,10vw,72px)}
.adjust-buttons button{flex:none;height:clamp(44px,8vh,64px);font-size:clamp(26px,5vw,36px);padding:0}
.label{display:none}
.status{margin-top:12px}

@media(orientation:landscape){
  header{padding:4px}
  .app{padding-left:3%;padding-right:3%}
  .time{font-size:clamp(120px,42vh,300px)}
  .status{margin-top:6px}
  .controls{padding:4px 0 10px}
  .row{margin:0}
  button{height:clamp(50px,11vh,76px)}
}</style>
</head>
<body>
<main class="app" id="app">
<header>KORFBAL · SCHOTKLOK</header>

<section class="display stopped" id="display" aria-live="off">

  <div class="counter">
    <div class="adjust-buttons">
      <button class="adjust" id="plus" aria-label="Een seconde erbij">+</button>
      <button class="adjust" id="minus" aria-label="Een seconde eraf">−</button>
    </div>
    <div class="time" id="time">25</div>
  </div>

  <div class="status" id="status">GESTOPT</div>

</section>
<section class="controls">

  <div class="row">
    <button class="start" id="start">START</button>
    <button class="stop" id="stop">STOP</button>
    <button class="reset" id="reset">RESET</button>
  </div>

</section>
</main>
<script>
(()=>{
const MAX=25,MIN=1;
let value=MAX,running=false,deadline=0,interval=null,audio=null;
const time=document.getElementById('time');
const display=document.getElementById('display');
const status=document.getElementById('status');

function render(){
time.textContent=value;
display.classList.toggle('running',running);
display.classList.toggle('stopped',!running&&value>0);
display.classList.toggle('zero',value===0);
status.textContent=value===0?'TIJD VERSTREKEN':running?'LOPEND':'GESTOPT';
}
function sound(){
try{
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
audio=audio||new AC();
if(audio.state==='suspended')audio.resume();
const osc=audio.createOscillator(),gain=audio.createGain();
osc.frequency.value=880;
gain.gain.value=.25;
osc.connect(gain);gain.connect(audio.destination);
osc.start();
osc.stop(audio.currentTime+.65);
}catch(e){}
}
function finish(){
running=false;
value=0;
clearInterval(interval);interval=null;
render();
if(navigator.vibrate)navigator.vibrate([250,100,250,100,400]);
sound();
}
function update(){
if(!running)return;
const remaining=Math.max(0,deadline-Date.now());
value=Math.ceil(remaining/1000);
if(remaining<=0){finish();return}
render();
}
function start(){
if(running)return;
if(value===0)value=MAX;
running=true;
deadline=Date.now()+value*1000;
clearInterval(interval);
interval=setInterval(update,40);
render();
}
function stop(){
if(running){
update();
if(running){
running=false;
clearInterval(interval);interval=null;
}
}
render();
}
function reset(){
const wasRunning=running;
value=MAX;
if(wasRunning){
deadline=Date.now()+MAX*1000;
clearInterval(interval);
interval=setInterval(update,40);
}
render();
}
function plus(){
value=value>=MAX?MIN:value+1;
if(running)deadline=Date.now()+value*1000;
render();
}
function minus(){
value=value<=MIN?MAX:value-1;
if(running)deadline=Date.now()+value*1000;
render();
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('plus').addEventListener('click',plus);
document.getElementById('minus').addEventListener('click',minus);
document.addEventListener('visibilitychange',()=>{if(running)update()});
render();
})();
</script>
</body>
</html>
