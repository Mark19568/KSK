<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Korfbal Schotklok</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .app{width:100%;height:100%;max-width:900px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);background:#000}
  header{height:54px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
  .display{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
  .time{font-variant-numeric:tabular-nums;font-size:clamp(150px,42vw,360px);font-weight:800;line-height:.85;letter-spacing:-.07em}
  .label{font-size:14px;letter-spacing:.2em;margin-top:22px;color:#aaa}
  .running .time{color:#fff}
  .stopped .time{color:#777}
  .zero .time{color:#fff}
  .controls{padding-bottom:18px}
  .row{display:flex;gap:12px;margin-top:12px}
  button{border:0;border-radius:16px;color:#fff;background:#202020;font-size:24px;font-weight:700;height:64px;flex:1;touch-action:manipulation}
  button:active{transform:scale(.97);background:#383838}
  .start{background:#1b6e3a}
  .start:active{background:#258b4a}
  .reset{background:#333}
  .small{font-size:20px}
  .plusminus{font-size:34px}
  .hint{text-align:center;color:#555;font-size:11px;margin-top:10px}
  @media (orientation:landscape){
    header{height:38px}
    .time{font-size:clamp(130px,38vh,260px)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 5%}
    .row{margin:0}
    .row:first-child{grid-column:1/3}
    .hint{display:none}
    button{height:54px}
  }
</style>
</head>
<body>
<main class="app" id="app">
  <header>Schotklok</header>
  <section class="display" aria-live="polite">
    <div class="time" id="time">25</div>
    <div class="label">SECONDEN</div>
  </section>
  <section class="controls">
    <div class="row">
      <button class="plusminus" id="minus" aria-label="1 seconde eraf">−</button>
      <button class="plusminus" id="plus" aria-label="1 seconde erbij">+</button>
    </div>
    <div class="row">
      <button class="start" id="start">START</button>
      <button class="reset" id="reset">RESET</button>
      <button class="small" id="stop">STOP</button>
    </div>
    <div class="hint">Start · Stop · Reset · +1 · −1</div>
  </section>
</main>
<script>
(() => {
  const MAX=25, MIN=1;
  let value=MAX, running=false, last=0, raf=null;
  const time=document.getElementById('time'), app=document.getElementById('app');

  function render(){
    time.textContent=value;
    app.classList.toggle('running',running);
    app.classList.toggle('stopped',!running && value!==0);
    app.classList.toggle('zero',value===0);
  }
  function tick(ts){
    if(!running) return;
    if(!last) last=ts;
    const elapsed=ts-last;
    if(elapsed>=1000){
      const steps=Math.floor(elapsed/1000);
      value=Math.max(0,value-steps);
      last += steps*1000;
      render();
      if(value===0){
        running=false;
        last=0;
        if(navigator.vibrate) navigator.vibrate([180,100,180]);
        beep();
        return;
      }
    }
    raf=requestAnimationFrame(tick);
  }
  function start(){
    if(value===0) value=MAX;
    if(!running){ running=true; last=0; raf=requestAnimationFrame(tick); render(); }
  }
  function stop(){
    running=false; last=0;
    if(raf) cancelAnimationFrame(raf);
    render();
  }
  function reset(){
    value=MAX;
    if(running){ last=0; if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
    render();
  }
  function plus(){
    value = value>=MAX ? MIN : value+1;
    render();
  }
  function minus(){
    value = value<=MIN ? MAX : value-1;
    render();
  }
  function beep(){
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C) return;
      const c=new C(),o=c.createOscillator(),g=c.createGain();
      o.frequency.value=880; g.gain.value=.15;
      o.connect(g);g.connect(c.destination);o.start();
      setTimeout(()=>{o.stop();c.close()},250);
    }catch(e){}
  }
  document.getElementById('start').onclick=start;
  document.getElementById('stop').onclick=stop;
  document.getElementById('reset').onclick=reset;
  document.getElementById('plus').onclick=plus;
  document.getElementById('minus').onclick=minus;

  // Voorkom ongewenst zoomen/dubbel-tappen.
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault());

  render();
})();
</script>
</body>
</html>
