
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Korfbal Schotklok</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
body{display:flex;justify-content:center;align-items:center}
.app{width:100%;height:100%;height:100dvh;max-width:1000px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
header{text-align:center;padding:12px 0;font-size:clamp(16px,3vw,24px);font-weight:800;letter-spacing:4px;color:#aaa}
.display{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px}
.time{font-size:clamp(180px,52vw,420px);font-weight:900;line-height:.85;letter-spacing:-.07em;font-variant-numeric:tabular-nums}
.label{margin-top:24px;font-size:clamp(14px,3vw,20px);font-weight:700;letter-spacing:7px;color:#888}
.status{margin-top:18px;font-size:clamp(13px,3vw,18px);font-weight:800;letter-spacing:2px;color:#777}
.running .time{color:#fff}
.stopped .time{color:#aaa}
.zero .time{color:#ff3434}
.zero .status{color:#ff3434}
.controls{padding:14px 0 18px}
.row{display:flex;gap:12px;margin-top:12px}
button{border:0;border-radius:16px;min-width:0;flex:1;height:clamp(58px,10vh,82px);font-size:clamp(20px,5vw,30px);font-weight:900;color:#fff;background:#292929;touch-action:manipulation;user-select:none}
button:active{filter:brightness(1.35);transform:scale(.98)}
.adjust{background:#222}
.start{background:#087c3b}
.stop{background:#a52222}
.reset{background:#333}

.counter{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.adjust-buttons{display:flex;flex-direction:column;gap:8px;flex:none;width:clamp(48px,10vw,72px)}
.adjust-buttons button{flex:none;height:clamp(44px,8vh,64px);font-size:clamp(26px,5vw,36px);padding:0}
.label{display:none}
.status{margin-top:12px}

@media(orientation:landscape){
  header{padding:4px}
  .app{padding-left:3%;padding-right:3%}
  .time{font-size:clamp(120px,42vh,300px)}
  .status{margin-top:6px}
  .controls{padding:4px 0 10px}
  .row{margin:0}
  button{height:clamp(50px,11vh,76px)}
}
[hidden]{display:none!important}
header{position:relative}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);flex:none;width:auto;height:auto;padding:8px 14px;border-radius:12px;font-size:clamp(14px,3vw,20px);letter-spacing:0;background:#222;color:#aaa}
.menu{justify-content:center}
.menu .choices{display:flex;flex-direction:column;gap:18px;padding:18px 0}
.menu .choices button{flex:none;height:clamp(90px,20vh,150px);font-size:clamp(24px,6vw,40px);background:none;color:#fff}
.tdisplay{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ttime{font-size:clamp(90px,26vw,260px);font-weight:900;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#aaa}
.tclock{display:flex;flex-direction:column;align-items:center}
.ttime{display:flex}
.dg{display:inline-block;width:.62em;text-align:center}
.cl{display:inline-block;width:.3em;text-align:center}
.tbtns{display:flex;width:100%;justify-content:center;font-size:clamp(90px,26vw,260px);margin-top:8px}
.tbtns button{flex:none;height:clamp(40px,7vh,60px);font-size:clamp(20px,4vw,30px);padding:0;margin:0 3px;width:calc(.62em - 6px)}
.tbtns .gap{width:.3em;flex:none}
.tdisplay.running .ttime{color:#fff}
.tdisplay.zero .ttime{color:#ff3434}
.tdisplay .adjust-buttons{width:clamp(64px,12vw,88px);gap:6px}
.tdisplay .adjust-buttons button{height:clamp(34px,6vh,56px);font-size:clamp(16px,3.5vw,24px)}
@media(orientation:landscape){.ttime,.tbtns{font-size:clamp(90px,36vh,240px)}.menu .choices button{height:clamp(70px,28vh,130px)}}
</style>
</head>
<body>
<main class="app menu" id="menu">
<header>KORFBAL</header>
<div class="choices">
  <button id="open-timer">1. TIJDWAARNEMING</button>
  <button id="open-shot">2. SCHOTKLOK</button>
</div>
</main>

<main class="app" id="timer" hidden>
<header><button class="back" data-back aria-label="Terug naar menu">‹ MENU</button>TIJDWAARNEMING</header>
<section class="tdisplay stopped" id="tdisplay" aria-live="off">
  <div class="counter">
    <div class="adjust-buttons">
      <button class="adjust" id="t25">25:00</button>
      <button class="adjust" id="t10">10:00</button>
    </div>
    <div class="tclock">
      <div class="ttime" id="ttime"><span class="dg">2</span><span class="dg">5</span><span class="cl">:</span><span class="dg">0</span><span class="dg">0</span></div>
      <div class="tbtns">
        <button class="adjust" id="mplus" aria-label="Een minuut erbij">+</button>
        <button class="adjust" id="mminus" aria-label="Een minuut eraf">−</button>
        <span class="gap"></span>
        <button class="adjust" id="splus" aria-label="Een seconde erbij">+</button>
        <button class="adjust" id="sminus" aria-label="Een seconde eraf">−</button>
      </div>
    </div>
  </div>
</section>
<section class="controls">
  <div class="row">
    <button class="start" id="tstart">START</button>
    <button class="stop" id="tstop">STOP</button>
  </div>
</section>
</main>

<main class="app" id="shotclock" hidden>
<header><button class="back" data-back aria-label="Terug naar menu">‹ MENU</button>KORFBAL · SCHOTKLOK</header>

<section class="display stopped" id="display" aria-live="off">

  <div class="counter">
    <div class="adjust-buttons">
      <button class="adjust" id="plus" aria-label="Een seconde erbij">+</button>
      <button class="adjust" id="minus" aria-label="Een seconde eraf">−</button>
    </div>
    <div class="time" id="time">25</div>
  </div>

  <div class="status" id="status">GESTOPT</div>

</section>
<section class="controls">

  <div class="row">
    <button class="start" id="start">START</button>
    <button class="stop" id="stop">STOP</button>
    <button class="reset" id="reset">RESET</button>
  </div>

</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const show=id=>{['menu','timer','shotclock'].forEach(s=>$(s).hidden=s!==id)};
$('open-timer').addEventListener('click',()=>show('timer'));
$('open-shot').addEventListener('click',()=>show('shotclock'));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>location.reload()));

let tv=25*60,trunning=false,tdeadline=0,tinterval=null,taudio=null;
const ttime=$('ttime'),tdisplay=$('tdisplay');
function trender(){
const m=Math.floor(tv/60),s=tv%60;
const d=String(m).padStart(2,'0')+String(s).padStart(2,'0'),n=ttime.querySelectorAll('.dg');
for(let i=0;i<4;i++)n[i].textContent=d[i];
tdisplay.classList.toggle('running',trunning);
tdisplay.classList.toggle('zero',tv===0);
}
function unlock(){
try{
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
taudio=taudio||new AC();
if(taudio.state!=='running')taudio.resume();
}catch(e){}
}
function buzzer(){
try{
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
taudio=taudio||new AC();
if(taudio.state==='suspended')taudio.resume();
const osc=taudio.createOscillator(),gain=taudio.createGain();
osc.type='sawtooth';osc.frequency.value=150;
gain.gain.value=.3;
osc.connect(gain);gain.connect(taudio.destination);
osc.start();osc.stop(taudio.currentTime+1.5);
}catch(e){}
if(navigator.vibrate)navigator.vibrate([400,150,400]);
}
function tupdate(){
if(!trunning)return;
const remaining=Math.max(0,tdeadline-Date.now());
tv=Math.ceil(remaining/1000);
if(remaining<=0){
trunning=false;tv=0;
clearInterval(tinterval);tinterval=null;
trender();buzzer();return;
}
trender();
}
function tset(v){
tv=Math.max(0,Math.min(99*60+59,v));
if(trunning){
if(tv===0){tupdate();trunning=false;clearInterval(tinterval);tinterval=null;trender();buzzer();return}
tdeadline=Date.now()+tv*1000;
}
trender();
}
$('tstart').addEventListener('click',()=>{
if(trunning||tv===0)return;
unlock();
trunning=true;
tdeadline=Date.now()+tv*1000;
tinterval=setInterval(tupdate,30);
trender();
});
$('tstop').addEventListener('click',()=>{
if(trunning){tupdate();trunning=false;clearInterval(tinterval);tinterval=null}
trender();
});
$('t25').addEventListener('click',()=>tset(25*60));
$('t10').addEventListener('click',()=>tset(10*60));
const adj=f=>()=>{tupdate();let m=Math.floor(tv/60),s=tv%60;[m,s]=f(m,s)||[m,s];tset(m*60+s)};
$('mplus').addEventListener('click',adj((m,s)=>[(m+1)%100,s]));
$('mminus').addEventListener('click',adj((m,s)=>[(m+99)%100,s]));
$('splus').addEventListener('click',adj((m,s)=>{if(m===99&&s===59)return;return s===59?[m+1,0]:[m,s+1]}));
$('sminus').addEventListener('click',adj((m,s)=>{if(m===0&&s===0)return;return s===0?[m-1,59]:[m,s-1]}));

document.addEventListener('visibilitychange',()=>{if(trunning)tupdate()});
trender();
})();
(()=>{
const MAX=25,MIN=1;
let value=MAX,running=false,deadline=0,interval=null,audio=null;
const time=document.getElementById('time');
const display=document.getElementById('display');
const status=document.getElementById('status');

function render(){
time.textContent=value;
display.classList.toggle('running',running);
display.classList.toggle('stopped',!running&&value>0);
display.classList.toggle('zero',value===0);
status.textContent=value===0?'TIJD VERSTREKEN':running?'LOPEND':'GESTOPT';
}
function sound(){
try{
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
audio=audio||new AC();
if(audio.state==='suspended')audio.resume();
const osc=audio.createOscillator(),gain=audio.createGain();
osc.frequency.value=880;
gain.gain.value=.25;
osc.connect(gain);gain.connect(audio.destination);
osc.start();
osc.stop(audio.currentTime+.65);
}catch(e){}
}
function finish(){
running=false;
value=0;
clearInterval(interval);interval=null;
render();
if(navigator.vibrate)navigator.vibrate([250,100,250,100,400]);
sound();
}
function update(){
if(!running)return;
const remaining=Math.max(0,deadline-Date.now());
value=Math.ceil(remaining/1000);
if(remaining<=0){finish();return}
render();
}
function start(){
if(running)return;
if(value===0)value=MAX;
running=true;
deadline=Date.now()+value*1000;
clearInterval(interval);
interval=setInterval(update,40);
render();
}
function stop(){
if(running){
update();
if(running){
running=false;
clearInterval(interval);interval=null;
}
}
render();
}
function reset(){
const wasRunning=running;
value=MAX;
if(wasRunning){
deadline=Date.now()+MAX*1000;
clearInterval(interval);
interval=setInterval(update,40);
}
render();
}
function plus(){
value=value>=MAX?MIN:value+1;
if(running)deadline=Date.now()+value*1000;
render();
}
function minus(){
value=value<=MIN?MAX:value-1;
if(running)deadline=Date.now()+value*1000;
render();
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('plus').addEventListener('click',plus);
document.getElementById('minus').addEventListener('click',minus);
document.addEventListener('visibilitychange',()=>{if(running)update()});
render();
})();
</script>
</body>
</html>
